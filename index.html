<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BHA Cover Page Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Caladea:wght@700&family=Hind:wght@500;700&family=Merriweather:wght@700&family=Mukta:wght@700&family=Noto+Serif:wght@700&family=Noto+Serif+Devanagari:wght@700&family=Poppins:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="d">
<main>
<div class="top"><h1><i>★</i> BHA cover page maker</h1>
<details class="ses"><summary>Session</summary><div class="pop"><label for="ses">Session</label><input id="ses" autocomplete="off"><p class="note">Fills itself using the April rule. Change it only if you need another session.</p></div></details></div>
<div class="seg" id="lang"><button data-l="en" aria-pressed="true">English</button><button data-l="hi" aria-pressed="false">हिन्दी</button></div>
<div class="wrap">
<div class="prev"><canvas id="cv" aria-label="Cover page preview"></canvas><button class="full" id="full">Full view</button></div>
<div class="ctrl">
<div class="seg tabs" id="tabs"><button data-t="d" aria-pressed="true">Details</button><button data-t="s" aria-pressed="false">Style &amp; position</button></div>
<section class="card" id="details"><div id="form"></div></section>
<section class="card" id="style">
<div class="chips" id="chips"></div>
<div class="fld"><label for="fnt">Font</label><select id="fnt"></select></div>
<div class="fld"><label for="sz">Size <output id="szo"></output></label><input type="range" id="sz" min="8" max="180"></div>
<div class="fld"><label for="px">Move left / right</label><input type="range" id="px" min="0" max="100" step="0.1"></div>
<div class="fld"><label for="py">Move up / down</label><input type="range" id="py" min="0" max="100" step="0.1"></div>
<div class="row" id="colrow"><label for="col" style="margin:0">Color</label><input type="color" id="col"><button id="allred">All red</button><button id="allblk">All black</button></div>
<div class="row"><button id="rst">Reset this text</button></div>
<label class="chk"><input type="checkbox" id="drag" checked> Drag text on the page to move it</label>
<p class="note" style="margin-top:8px">Turn dragging off if you want to scroll with your finger over the page.</p>
</section>
</div>
</div>
</main>
<div class="bar"><button id="clr">Clear all</button><button id="dl" class="pri">Download PNG</button></div>
<div id="toast" hidden></div>
<div id="ov" hidden><img id="ovi" alt="Full cover page"></div>
<script src="script.js"></script>
</body>
</html>
